# Origin: opt-in CIX P1 persistent-root profile, AI-assisted.
# Use only with the exact firmware-table profile in cix-spcr.md.
# Put this file at boot.cfg in the loader's EFI filesystem root.
# Supply the checked netbsd.wifi.gz kernel and an FFS wedge ember-cix-root.
# The kernel must not set MEMORY_DISK_IS_ROOT. Keep /netbsd and root.fs
# as a matching known working RAM-root recovery pair on the boot filesystem.
# SPCR failure is printed; this loader does not abort a command chain.
banner=EmberBSD CIX P1
menu=CIX persistent root:acpi cix-spcr;userconf disable acpibat;initrd;boot netbsd.wifi.gz -v root=NAME=ember-cix-root
menu=CIX RAM recovery:acpi cix-spcr;userconf disable acpibat;initrd root.fs;boot /netbsd -s
menu=Boot prompt:prompt
default=1
timeout=5
clear=0
