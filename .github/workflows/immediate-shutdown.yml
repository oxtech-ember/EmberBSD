name: Immediate orderly shutdown contracts

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/immediate-shutdown.yml'
      - 'sbin/shutdown/**'
      - 'sbin/reboot/**'
      - 'ember/tools/immediate-shutdown-*'
  pull_request:
    paths:
      - '.github/workflows/immediate-shutdown.yml'
      - 'sbin/shutdown/**'
      - 'sbin/reboot/**'
      - 'ember/tools/immediate-shutdown-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sbin/shutdown/shutdown.c
            /sbin/reboot/reboot.c
            /ember/tools/immediate-shutdown-*
      - name: Prepare GCC16 and analysis tools
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          gcc -dumpmachine
          apt-get update
          apt-get install -y --no-install-recommends ruby clang cppcheck valgrind libc6-dbg
          clang --version
          cppcheck --version
          valgrind --version
      - name: Run native source with path and static analysis
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4 -fanalyzer
          IMMEDIATE_ANALYZE: '1'
        run: sh ember/tools/immediate-shutdown-contract.sh
      - name: Run ASan and UBSan
        env:
          CC: gcc
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          UBSAN_OPTIONS: halt_on_error=1
        run: sh ember/tools/immediate-shutdown-contract.sh
      - name: Run complete contracts under Memcheck
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4
        run: |
          cat > "$RUNNER_TEMP/immediate-memcheck" <<'SH'
          #!/bin/sh
          exec valgrind --tool=memcheck --error-exitcode=97 \
            --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all \
            --track-origins=yes "$@"
          SH
          chmod 755 "$RUNNER_TEMP/immediate-memcheck"
          export TEST_RUNNER="$RUNNER_TEMP/immediate-memcheck"
          sh ember/tools/immediate-shutdown-contract.sh
