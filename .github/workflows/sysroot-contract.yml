name: OS distribution contracts

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/sysroot-contract.yml'
      - 'ember/tests/release-aarch64-sets.rb'
      - 'ember/tests/installer-image*.py'
      - 'distrib/sets/**'
  pull_request:
    paths:
      - '.github/workflows/sysroot-contract.yml'
      - 'ember/tests/release-aarch64-sets.rb'
      - 'ember/tests/installer-image*.py'
      - 'distrib/sets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install host fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 ruby bmake libarchive-tools
      - name: Check OS set selectors and installation image contract
        run: |
          ruby ember/tests/release-aarch64-sets.rb /usr/bin/bmake
          python3 -B ember/tests/installer-image-contract.py
