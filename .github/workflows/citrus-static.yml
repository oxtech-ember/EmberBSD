name: Static Citrus conversion contracts

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/citrus-static.yml'
      - 'lib/libc/citrus/**'
      - 'lib/libc/iconv/**'
      - 'lib/i18n_module/**'
      - 'common/lib/libc/stdlib/_strto*.h'
      - 'common/lib/libc/string/strlcpy.c'
      - 'sys/sys/queue.h'
      - 'share/mk/**'
      - 'share/i18n/**'
      - 'ember/tools/citrus-static-*'
      - 'lib/libc/citrus/docs/static-citrus.md'
  pull_request:
    paths:
      - '.github/workflows/citrus-static.yml'
      - 'lib/libc/citrus/**'
      - 'lib/libc/iconv/**'
      - 'lib/i18n_module/**'
      - 'common/lib/libc/stdlib/_strto*.h'
      - 'common/lib/libc/string/strlcpy.c'
      - 'sys/sys/queue.h'
      - 'share/mk/**'
      - 'share/i18n/**'
      - 'ember/tools/citrus-static-*'
      - 'lib/libc/citrus/docs/static-citrus.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/libc/citrus/
            /lib/libc/iconv/
            /lib/i18n_module/shlib_version
            /common/lib/libc/stdlib/_strtol.h
            /common/lib/libc/stdlib/_strtoul.h
            /common/lib/libc/string/strlcpy.c
            /sys/sys/queue.h
            /share/mk/
            /share/i18n/iconv/iconv.dir
            /share/i18n/csmapper/ISO646/ISO646-US%UCS.646
            /ember/tools/citrus-static-*
      - name: Prepare GCC16 and analysis tools
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          gcc -dumpmachine
          apt-get update
          apt-get install -y --no-install-recommends ruby clang cppcheck valgrind libc6-dbg bmake
          clang --version
          cppcheck --version
          valgrind --version
      - name: Check native static and shared archive selection
        run: sh ember/tools/citrus-static-make-contract.sh
      - name: Run native source with path and static analysis
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4 -fanalyzer
          CITRUS_ANALYZE: '1'
        run: sh ember/tools/citrus-static-contract.sh
      - name: Run ASan and UBSan
        env:
          CC: gcc
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          UBSAN_OPTIONS: halt_on_error=1
        run: sh ember/tools/citrus-static-contract.sh
      - name: Run complete contracts under Memcheck
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4
        run: |
          cat > "$RUNNER_TEMP/citrus-memcheck" <<'SH'
          #!/bin/sh
          # Citrus intentionally keeps its native mapper area and identity
          # mapper reachable for process lifetime. Other leak kinds are errors.
          exec valgrind --tool=memcheck --error-exitcode=97 \
            --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect,possible \
            --track-origins=yes "$@"
          SH
          chmod 755 "$RUNNER_TEMP/citrus-memcheck"
          export TEST_RUNNER="$RUNNER_TEMP/citrus-memcheck"
          sh ember/tools/citrus-static-contract.sh
