name: Native net80211 crypto, scan, aggregation and WME contracts

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/net80211.yml'
      - 'sys/net80211/**'
      - 'sys/crypto/aes/**'
      - 'sys/sys/mbuf.h'
      - 'sys/sys/queue.h'
      - 'ember/tools/ccmp*'
      - 'ember/tools/net80211-*'
      - 'external/bsd/wpa/dist/src/drivers/driver_bsd.c'
      - 'sys/dev/ic/rtw88_net.c'
      - 'sys/dev/ic/ath.c'
      - 'sys/dev/ic/rt2661.c'
      - 'sys/dev/ic/rt2661reg.h'
      - 'sys/dev/ic/rt2860.c'
      - 'sys/dev/ic/rt2860reg.h'
      - 'sys/dev/ic/rtwnreg.h'
      - 'sys/dev/pci/if_iwi.c'
      - 'sys/dev/pci/if_iwireg.h'
      - 'sys/dev/pci/if_iwm.c'
      - 'sys/dev/pci/if_iwmreg.h'
      - 'sys/dev/pci/if_iwn.c'
      - 'sys/dev/pci/if_iwnreg.h'
      - 'sys/dev/pci/if_rtwn.c'
      - 'sys/dev/pci/if_wpi.c'
      - 'sys/dev/pci/if_wpireg.h'
      - 'sys/dev/usb/if_run.c'
      - 'sys/dev/usb/if_urtwn.c'
      - 'ember/development/iwx-be200/src/if_iwx.c'
      - 'ember/development/iwx-be200/src/if_iwxreg.h'
  pull_request:
    paths:
      - '.github/workflows/net80211.yml'
      - 'sys/net80211/**'
      - 'sys/crypto/aes/**'
      - 'sys/sys/mbuf.h'
      - 'sys/sys/queue.h'
      - 'ember/tools/ccmp*'
      - 'ember/tools/net80211-*'
      - 'external/bsd/wpa/dist/src/drivers/driver_bsd.c'
      - 'sys/dev/ic/rtw88_net.c'
      - 'sys/dev/ic/ath.c'
      - 'sys/dev/ic/rt2661.c'
      - 'sys/dev/ic/rt2661reg.h'
      - 'sys/dev/ic/rt2860.c'
      - 'sys/dev/ic/rt2860reg.h'
      - 'sys/dev/ic/rtwnreg.h'
      - 'sys/dev/pci/if_iwi.c'
      - 'sys/dev/pci/if_iwireg.h'
      - 'sys/dev/pci/if_iwm.c'
      - 'sys/dev/pci/if_iwmreg.h'
      - 'sys/dev/pci/if_iwn.c'
      - 'sys/dev/pci/if_iwnreg.h'
      - 'sys/dev/pci/if_rtwn.c'
      - 'sys/dev/pci/if_wpi.c'
      - 'sys/dev/pci/if_wpireg.h'
      - 'sys/dev/usb/if_run.c'
      - 'sys/dev/usb/if_urtwn.c'
      - 'ember/development/iwx-be200/src/if_iwx.c'
      - 'ember/development/iwx-be200/src/if_iwxreg.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ember/tools/ccmp*
            /ember/tools/net80211-*
            /sys/net80211/
            /sys/crypto/aes/
            /sys/sys/mbuf.h
            /sys/sys/queue.h
            /external/bsd/wpa/dist/src/drivers/driver_bsd.c
            /sys/dev/ic/rtw88_net.c
            /sys/dev/ic/ath.c
            /sys/dev/ic/rt2661.c
            /sys/dev/ic/rt2661reg.h
            /sys/dev/ic/rt2860.c
            /sys/dev/ic/rt2860reg.h
            /sys/dev/ic/rtwnreg.h
            /sys/dev/pci/if_iwi.c
            /sys/dev/pci/if_iwireg.h
            /sys/dev/pci/if_iwm.c
            /sys/dev/pci/if_iwmreg.h
            /sys/dev/pci/if_iwn.c
            /sys/dev/pci/if_iwnreg.h
            /sys/dev/pci/if_rtwn.c
            /sys/dev/pci/if_wpi.c
            /sys/dev/pci/if_wpireg.h
            /sys/dev/usb/if_run.c
            /sys/dev/usb/if_urtwn.c
            /ember/development/iwx-be200/src/if_iwx.c
            /ember/development/iwx-be200/src/if_iwxreg.h
      - name: Prepare GCC16 and source analyzers
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          apt-get update
          apt-get install -y --no-install-recommends python3 valgrind libc6-dbg clang cppcheck
          valgrind --version
      - name: Check optimized actual sources under Memcheck
        env:
          CC: gcc
          CCMP_TEST_CFLAGS: -O2 -g -gdwarf-4
          AMSDU_TEST_CFLAGS: -O2 -g -gdwarf-4
          PHY_IES_TEST_CFLAGS: -O2 -g -gdwarf-4
          WME_TEST_CFLAGS: -O2 -g -gdwarf-4
          MANUAL_SCAN_CFLAGS: -O2 -g -gdwarf-4
          TXOP_TEST_CFLAGS: -O2 -g -gdwarf-4
        run: |
          cat > "$RUNNER_TEMP/memcheck" <<'SH'
          #!/bin/sh
          exec valgrind --tool=memcheck --error-exitcode=97 \
            --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all \
            --track-origins=yes "$@"
          SH
          chmod 755 "$RUNNER_TEMP/memcheck"
          export TEST_RUNNER="$RUNNER_TEMP/memcheck"
          sh ember/tools/ccmp-contract.sh
          sh ember/tools/net80211-crypto-bounds-contract.sh
          sh ember/tools/net80211-amsdu-parser-contract.sh
          sh ember/tools/net80211-amsdu-contract.sh
          sh ember/tools/net80211-phy-ies-parser-contract.sh
          sh ember/tools/net80211-phy-ies-contract.sh
          python3 ember/tools/net80211-manual-scan-contract.py
          sh ember/tools/net80211-txop-contract.sh
          sh ember/tools/net80211-wme-contract.sh
      - name: Analyze unoptimized actual source paths
        env:
          CC: gcc
          CCMP_TEST_CFLAGS: -O0 -g -gdwarf-4 -fanalyzer
          CCMP_ANALYZE: '1'
          TXOP_TEST_CFLAGS: -O0 -g -gdwarf-4 -fanalyzer
          TXOP_ANALYZE: '1'
          WME_TEST_CFLAGS: -O0 -g -gdwarf-4 -fanalyzer
          WME_ANALYZE: '1'
          MANUAL_SCAN_CFLAGS: -O0 -g -gdwarf-4
          MANUAL_SCAN_ANALYZE: '1'
        run: |
          sh ember/tools/ccmp-contract.sh
          sh ember/tools/net80211-crypto-bounds-contract.sh
          sh ember/tools/net80211-amsdu-analysis.sh
          sh ember/tools/net80211-phy-ies-analysis.sh
          python3 ember/tools/net80211-manual-scan-contract.py
          sh ember/tools/net80211-txop-contract.sh
          sh ember/tools/net80211-wme-contract.sh
      - name: Check actual sources under ASan and UBSan
        env:
          CC: gcc
          CCMP_TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          AMSDU_TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          PHY_IES_TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          WME_TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          MANUAL_SCAN_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          TXOP_TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sh ember/tools/ccmp-contract.sh
          sh ember/tools/net80211-crypto-bounds-contract.sh
          sh ember/tools/net80211-amsdu-parser-contract.sh
          sh ember/tools/net80211-amsdu-contract.sh
          sh ember/tools/net80211-phy-ies-parser-contract.sh
          sh ember/tools/net80211-phy-ies-contract.sh
          python3 ember/tools/net80211-manual-scan-contract.py
          sh ember/tools/net80211-txop-contract.sh
          sh ember/tools/net80211-wme-contract.sh
