name: CIX P1 boot profile contract

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/cix-p1-boot.yml'
      - 'ember/boot/cix-p1-persistent.cfg'
      - 'ember/tests/cix-p1-boot.*'
      - 'sys/lib/libsa/bootcfg.*'
      - 'sys/sys/queue.h'
      - 'sys/stand/efiboot/boot.c'
      - 'sys/stand/efiboot/bootmenu.c'
      - 'sys/stand/efiboot/prompt.c'
      - 'sys/stand/efiboot/userconf.c'
  pull_request:
    paths:
      - '.github/workflows/cix-p1-boot.yml'
      - 'ember/boot/cix-p1-persistent.cfg'
      - 'ember/tests/cix-p1-boot.*'
      - 'sys/lib/libsa/bootcfg.*'
      - 'sys/sys/queue.h'
      - 'sys/stand/efiboot/boot.c'
      - 'sys/stand/efiboot/bootmenu.c'
      - 'sys/stand/efiboot/prompt.c'
      - 'sys/stand/efiboot/userconf.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ember/boot/cix-p1-persistent.cfg
            /ember/tests/cix-p1-boot.*
            /sys/lib/libsa/bootcfg.*
            /sys/sys/queue.h
            /sys/stand/efiboot/boot.c
            /sys/stand/efiboot/bootmenu.c
            /sys/stand/efiboot/prompt.c
            /sys/stand/efiboot/userconf.c
      - name: Prepare GCC16 and Memcheck
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          apt-get update
          apt-get install -y --no-install-recommends valgrind libc6-dbg
      - name: Execute the profile under Memcheck
        env:
          CC: gcc
          TEST_CFLAGS: -O2 -g -gdwarf-4
        run: |
          cat > "$RUNNER_TEMP/memcheck" <<'SH'
          #!/bin/sh
          exec valgrind --tool=memcheck --error-exitcode=97 \
            --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all \
            --track-origins=yes "$@"
          SH
          chmod 755 "$RUNNER_TEMP/memcheck"
          TEST_RUNNER="$RUNNER_TEMP/memcheck" \
            sh ember/tests/cix-p1-boot.sh "$RUNNER_TEMP/cix-memcheck"
      - name: Execute the profile under ASan and UBSan
        env:
          CC: gcc
          TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: sh ember/tests/cix-p1-boot.sh "$RUNNER_TEMP/cix-asan"
      - name: Analyze the unchanged loader bodies
        # The inherited ARM empty-command finding remains visible here.
        # The profile contract rejects empty/oversized segments before dispatch.
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -fanalyzer \
            -I"$RUNNER_TEMP/cix-memcheck" -c ember/tests/cix-p1-boot.c \
            -o "$RUNNER_TEMP/cix-analysis.o"
