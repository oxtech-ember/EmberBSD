name: AArch64 reboot request contract

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/aarch64-reboot.yml'
      - 'sys/arch/aarch64/aarch64/aarch64_reboot.c'
      - 'sys/sys/reboot.h'
      - 'ember/tools/aarch64-reboot-contract.c'
      - 'ember/tools/aarch64-reboot-contract.sh'
  pull_request:
    paths:
      - '.github/workflows/aarch64-reboot.yml'
      - 'sys/arch/aarch64/aarch64/aarch64_reboot.c'
      - 'sys/sys/reboot.h'
      - 'ember/tools/aarch64-reboot-contract.c'
      - 'ember/tools/aarch64-reboot-contract.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      # Same official GCC 16.2 image as the CIX source contract workflows.
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sys/arch/aarch64/aarch64/aarch64_reboot.c
            /sys/sys/reboot.h
            /ember/tools/aarch64-reboot-contract.c
            /ember/tools/aarch64-reboot-contract.sh
      - name: Prepare Memcheck
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          gcc -dumpmachine
          apt-get update
          apt-get install -y --no-install-recommends valgrind libc6-dbg
          valgrind --version
      - name: Execute actual source with GCC analyzer
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4 -fanalyzer
        run: |
          REBOOT_EVIDENCE="$RUNNER_TEMP/aarch64-reboot" \
            sh ember/tools/aarch64-reboot-contract.sh
      - name: Check the same executable with Memcheck
        run: |
          valgrind --tool=memcheck --error-exitcode=97 \
            --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all \
            --track-origins=yes "$RUNNER_TEMP/aarch64-reboot/contract"
      - name: Execute ASan and UBSan contract
        env:
          CC: gcc
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          UBSAN_OPTIONS: halt_on_error=1
        run: sh ember/tools/aarch64-reboot-contract.sh
