name: CIX P1 startup contracts

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/cix-p1-startup.yml'
      - 'ember/image/cix-p1-*'
      - 'ember/image/test-cix-p1-*'
      - 'ember/image/static-profile.py'
      - 'ember/image/test-static-console.py'
      - 'ember/image/fixtures/cix-*'
      - 'ember/tools/cix-native-prefix-contract.py'
      - 'etc/MAKEDEV.awk'
      - 'etc/MAKEDEV.tmpl'
      - 'etc/etc.aarch64/MAKEDEV.conf'
      - 'etc/group'
      - 'etc/master.passwd'
      - 'sys/conf/majors'
      - 'sys/arch/aarch64/conf/majors.aarch64'
  pull_request:
    paths:
      - '.github/workflows/cix-p1-startup.yml'
      - 'ember/image/cix-p1-*'
      - 'ember/image/test-cix-p1-*'
      - 'ember/image/static-profile.py'
      - 'ember/image/test-static-console.py'
      - 'ember/image/fixtures/cix-*'
      - 'ember/tools/cix-native-prefix-contract.py'
      - 'etc/MAKEDEV.awk'
      - 'etc/MAKEDEV.tmpl'
      - 'etc/etc.aarch64/MAKEDEV.conf'
      - 'etc/group'
      - 'etc/master.passwd'
      - 'sys/conf/majors'
      - 'sys/arch/aarch64/conf/majors.aarch64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.15'
      # The userland test runs its builder with PATH limited to this prefix.
      - name: Provide the native SDK tool prefix
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mksh original-awk
          native=$RUNNER_TEMP/native-prefix
          mkdir -p "$native/bin" "$native/gnu/bin"
          ln -s /usr/bin/mksh "$native/bin/mksh"
          ln -s /usr/bin/mksh "$native/bin/sh"
          ln -s /usr/bin/bash "$native/bin/bash"
          ln -s /usr/bin/original-awk "$native/bin/nawk"
          ln -s /usr/bin/original-awk "$native/bin/awk"
          ln -s /usr/bin/shasum "$native/bin/shasum"
          ln -s "$PYTHON" "$native/bin/python3.15"
          for tool in '[' basename cat chmod cksum cmp comm cp cut date dd diff \
              dirname du echo env expr false find grep head id install ln ls \
              m4 make mkdir mktemp mv od paste patch printf pwd readlink \
              realpath rm rmdir sed seq sha256sum sleep sort stat tail tee \
              test touch tr true uname uniq wc xargs; do
            test -x "/usr/bin/$tool"
            ln -s "/usr/bin/$tool" "$native/gnu/bin/$tool"
          done
          "$native/bin/python3.15" -c 'import sys; assert sys.version_info[:2] == (3, 15)'
          "$native/bin/mksh" -c 'echo native prefix: $KSH_VERSION'
          echo "EMBER_TEST_NATIVE_PREFIX=$native" >> "$GITHUB_ENV"
      - name: Check the native prefix contract
        run: python3 ember/tools/cix-native-prefix-contract.py
      - name: Check reduced-root startup and failures
        run: |
          export PATH="$EMBER_TEST_NATIVE_PREFIX/bin:$EMBER_TEST_NATIVE_PREFIX/gnu/bin"
          export TEST_SH="$EMBER_TEST_NATIVE_PREFIX/bin/bash"
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-native.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-static-console.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-i18n.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-ssh.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-userland.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-startup.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-console.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-power.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-root.py
          "$EMBER_TEST_NATIVE_PREFIX/bin/python3.15" -B ember/image/test-cix-p1-root-image.py
          for file in ember/image/cix-p1-*.sh ember/image/cix-p1-*.subr \
              ember/image/cix-p1-rc ember/image/cix-p1-rc.shutdown \
              ember/image/cix-p1-console \
              ember/image/cix-p1-power-button; do
            "$EMBER_TEST_NATIVE_PREFIX/bin/mksh" -n "$file"
          done
