name: Native RTL8822CE source contracts

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/rtw88.yml'
      - 'sys/dev/ic/rtw*'
      - 'sys/arch/evbarm/conf/EMBER64_CIX_RFK_NATIVE'
      - 'sys/conf/files'
      - 'sys/dev/ic/rt2661.c'
      - 'sys/dev/ic/rt2661reg.h'
      - 'sys/dev/pci/if_rtw88_pci.c'
      - 'sys/dev/pci/rtw88_pci_*'
      - 'sys/net80211/ieee80211.c'
      - 'sys/net80211/ieee80211_ioctl.c'
      - 'sys/net80211/ieee80211_proto.c'
      - 'sys/net80211/ieee80211_output.c'
      - 'sys/net80211/ieee80211_input.c'
      - 'sys/net80211/ieee80211_beacon_ies.c'
      - 'sys/net80211/ieee80211_node.c'
      - 'sys/net80211/ieee80211_ioctl.c'
      - 'sys/net80211/ieee80211_netbsd.c'
      - 'sys/net80211/*ieee80211*.h'
      - 'sbin/ifconfig/**'
      - 'sys/sys/ioccom.h'
      - 'sys/sys/sysctl.h'
      - 'sys/sys/queue.h'
      - 'sys/net/if.h'
      - 'sys/net/if.c'
      - 'external/bsd/wpa/dist/src/drivers/driver_bsd.c'
      - 'external/bsd/wpa/dist/wpa_supplicant/events.c'
      - 'sys/net/if_media.h'
      - 'sys/net/if_media.c'
      - 'sys/net/bpf.c'
      - 'sys/net/if_ether.h'
      - 'sys/kern/uipc_mbuf.c'
      - 'sys/kern/kern_sysctl.c'
      - 'sbin/sysctl/sysctl.c'
      - 'sys/sys/mbuf.h'
      - 'ember/image/cix-p1-network.subr'
      - 'ember/image/test-cix-p1-startup.py'
      - 'ember/tools/rtw*'
      - 'ember/tools/net80211-wme-contract.*'
      - 'ember/tools/net80211-ht20-contract.*'
      - 'ember/tools/net80211-rxba*'
      - 'ember/tools/ccmp*'
      - 'sys/crypto/aes/**'
      - 'sys/net80211/ieee80211_rxba.c'
      - 'sys/net80211/ieee80211_crypto*.c'
      - 'sys/net80211/ieee80211_amsdu.c'
      - 'sys/sys/callout.h'
      - 'sys/net80211/ieee80211_ht20.c'
      - 'sys/net80211/ieee80211_phy_ies.c'
      - 'sys/net80211/ieee80211_vht_ies.c'
      - 'sys/net80211/ieee80211_vht_ies.h'
      - 'ember/tools/net80211-phy-ies-contract.c'
      - 'ember/tools/net80211-phy-ies-extract.py'
      - 'sys/net80211/files.net80211'
      - 'sys/net80211/Makefile'
  pull_request:
    paths:
      - '.github/workflows/rtw88.yml'
      - 'sys/dev/ic/rtw*'
      - 'sys/arch/evbarm/conf/EMBER64_CIX_RFK_NATIVE'
      - 'sys/conf/files'
      - 'sys/dev/ic/rt2661.c'
      - 'sys/dev/ic/rt2661reg.h'
      - 'sys/dev/pci/if_rtw88_pci.c'
      - 'sys/dev/pci/rtw88_pci_*'
      - 'sys/net80211/ieee80211.c'
      - 'sys/net80211/ieee80211_ioctl.c'
      - 'sys/net80211/ieee80211_proto.c'
      - 'sys/net80211/ieee80211_output.c'
      - 'sys/net80211/ieee80211_input.c'
      - 'sys/net80211/ieee80211_beacon_ies.c'
      - 'sys/net80211/ieee80211_node.c'
      - 'sys/net80211/ieee80211_ioctl.c'
      - 'sys/net80211/ieee80211_netbsd.c'
      - 'sys/net80211/*ieee80211*.h'
      - 'sbin/ifconfig/**'
      - 'sys/sys/ioccom.h'
      - 'sys/sys/sysctl.h'
      - 'sys/sys/queue.h'
      - 'sys/net/if.h'
      - 'sys/net/if.c'
      - 'external/bsd/wpa/dist/src/drivers/driver_bsd.c'
      - 'external/bsd/wpa/dist/wpa_supplicant/events.c'
      - 'sys/net/if_media.h'
      - 'sys/net/if_media.c'
      - 'sys/net/bpf.c'
      - 'sys/net/if_ether.h'
      - 'sys/kern/uipc_mbuf.c'
      - 'sys/kern/kern_sysctl.c'
      - 'sbin/sysctl/sysctl.c'
      - 'sys/sys/mbuf.h'
      - 'ember/image/cix-p1-network.subr'
      - 'ember/image/test-cix-p1-startup.py'
      - 'ember/tools/rtw*'
      - 'ember/tools/net80211-wme-contract.*'
      - 'ember/tools/net80211-ht20-contract.*'
      - 'ember/tools/net80211-rxba*'
      - 'ember/tools/ccmp*'
      - 'sys/crypto/aes/**'
      - 'sys/net80211/ieee80211_rxba.c'
      - 'sys/net80211/ieee80211_crypto*.c'
      - 'sys/net80211/ieee80211_amsdu.c'
      - 'sys/sys/callout.h'
      - 'sys/net80211/ieee80211_ht20.c'
      - 'sys/net80211/ieee80211_phy_ies.c'
      - 'sys/net80211/ieee80211_vht_ies.c'
      - 'sys/net80211/ieee80211_vht_ies.h'
      - 'ember/tools/net80211-phy-ies-contract.c'
      - 'ember/tools/net80211-phy-ies-extract.py'
      - 'sys/net80211/files.net80211'
      - 'sys/net80211/Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    # Memcheck and path analysis dominate; shards run in parallel and
    # rtw88-workflow-contract.py proves each runner has exactly one shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [rfk, enable, routing, signal, rest-0, rest-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/rtw88.yml
            /ember/tools/rtw*
            /ember/tools/net80211-wme-contract.*
            /ember/tools/net80211-ht20-contract.*
            /ember/tools/net80211-rxba*
            /ember/tools/ccmp*
            /sys/crypto/aes/
            /sys/net80211/ieee80211_rxba.c
            /sys/net80211/ieee80211_rxba.h
            /sys/net80211/ieee80211_crypto*.c
            /sys/net80211/ieee80211_crypto.h
            /sys/net80211/ieee80211_amsdu.c
            /sys/net80211/ieee80211_amsdu.h
            /sys/net80211/ieee80211_netbsd.h
            /sys/sys/callout.h
            /sys/net80211/ieee80211_ht20.c
            /sys/net80211/ieee80211_phy_ies.c
            /sys/net80211/ieee80211_vht_ies.c
            /sys/net80211/ieee80211_vht_ies.h
            /ember/tools/net80211-phy-ies-contract.c
            /ember/tools/net80211-phy-ies-extract.py
            /sys/net80211/ieee80211_ht20.h
            /sys/dev/ic/rtw*
            /sys/dev/ic/rt2661.c
            /sys/dev/ic/rt2661reg.h
            /sys/dev/pci/if_rtw88_pci.c
            /sys/dev/pci/rtw88_pci_*
            /sys/dev/pci/pcidevs.h
            /sys/net80211/ieee80211.c
            /sys/net80211/ieee80211_ioctl.c
            /sys/net80211/ieee80211_proto.c
            /sys/net80211/ieee80211_output.c
            /sys/net80211/ieee80211_input.c
            /sys/net80211/ieee80211_node.c
            /sys/net80211/ieee80211_ioctl.c
            /sys/net80211/ieee80211_netbsd.c
            /sys/net80211/ieee80211_phy_ies.h
            /sys/net80211/ieee80211_beacon_ies.c
            /sys/net80211/ieee80211_beacon_ies.h
            /sys/net80211/_ieee80211.h
            /sys/net80211/ieee80211.h
            /sys/net80211/ieee80211_var.h
            /sys/net80211/ieee80211_proto.h
            /sys/net80211/ieee80211_ioctl.h
            /sys/net80211/ieee80211_node.h
            /sys/sys/ioccom.h
            /sys/sys/sysctl.h
            /sys/sys/queue.h
            /sys/net/if.h
            /sys/net/if.c
            /external/bsd/wpa/dist/src/drivers/driver_bsd.c
            /external/bsd/wpa/dist/wpa_supplicant/events.c
            /sys/net/if_media.h
            /sys/net/if_media.c
            /sys/net/bpf.c
            /sys/net/if_ether.h
            /sys/kern/uipc_mbuf.c
            /sys/kern/kern_sysctl.c
            /sbin/sysctl/sysctl.c
            /sys/sys/mbuf.h
            /sys/net80211/ieee80211_netbsd.h
            /sys/net80211/ieee80211_crypto.h
            /ember/image/cix-p1-network.subr
            /ember/image/test-cix-p1-startup.py
            /sbin/ifconfig/ieee80211.c
            /sbin/ifconfig/parse.c
            /sbin/ifconfig/parse.h
            /sbin/ifconfig/util.c
      - name: Prepare GCC16 and Memcheck
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          apt-get update
          apt-get install -y --no-install-recommends valgrind libc6-dbg ruby clang cppcheck python3
          valgrind --version
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo "TEST_SH=$(command -v sh)" >> "$GITHUB_ENV"
      - name: Verify native Wi-Fi sparse checkout inputs
        run: python3 ember/tools/rtw88-workflow-contract.py
      - name: Execute source contracts under ASan and UBSan
        env:
          CC: gcc
          RTW88_TEST_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          contracts=$(sh ember/tools/rtw88-ci-shard.sh "${{ matrix.shard }}")
          test -n "$contracts"
          for contract in $contracts; do
            echo "::group::$contract"
            sh "$contract" || { rc=$?; echo "::endgroup::"; echo "::error::$contract failed ($rc)"; exit "$rc"; }
            echo "::endgroup::"
          done
      - name: Execute actual source under Memcheck and GCC path analysis
        env:
          CC: gcc
          RTW88_TEST_CFLAGS: -O2 -g -gdwarf-4 -fanalyzer
          RTW88_STOP_ANALYZE: '1'
          RTW88_START_ANALYZE: '1'
          RTW88_MEDIA_ANALYZE: '1'
          RTW88_ROUTING_ANALYZE: '1'
          RTW88_ENABLE_ANALYZE: '1'
          RTW88_PCI_ANALYZE: '1'
          RTW88_RA_ANALYZE: '1'
          RTW88_RECONNECT_ANALYZE: '1'
          RTW88_HWFEATURE_ANALYZE: '1'
          RTW88_RFK_ANALYZE: '1'
          RXBA_ANALYZE: '1'
          HT20_ANALYZE: '1'
        run: |
          cat > "$RUNNER_TEMP/memcheck" <<'SH'
          #!/bin/sh
          # Let writer threads run while concurrent readers stay busy.
          exec valgrind --tool=memcheck --error-exitcode=97 \
            --fair-sched=yes \
            --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all \
            --track-origins=yes "$@"
          SH
          chmod 755 "$RUNNER_TEMP/memcheck"
          export TEST_RUNNER="$RUNNER_TEMP/memcheck"
          contracts=$(sh ember/tools/rtw88-ci-shard.sh "${{ matrix.shard }}")
          test -n "$contracts"
          for contract in $contracts; do
            echo "::group::$contract"
            sh "$contract" || { rc=$?; echo "::endgroup::"; echo "::error::$contract failed ($rc)"; exit "$rc"; }
            echo "::endgroup::"
          done
