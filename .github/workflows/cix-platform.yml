  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: gcc@sha256:3f73339bf0d3d64081cac3f6d9fdafc6dd4cef2b9c49e0a09f91e97cb0eb139a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ember/tools/cixclk-*
            /ember/tools/cix-uart2-console-*
            /ember/tools/cix-plcom-*
            /ember/tools/cixreset-*
            /ember/tools/cixvpu-*
            /ember/tools/acpi-power-*
            /ember/tools/xhci-acpi-rootbus-*
            /ember/tools/cixscmi-*
            /sys/dev/acpi/cixclk_acpi.*
            /sys/dev/acpi/cixreset_acpi.*
            /sys/dev/acpi/cixvpu_acpi_control*
            /sys/dev/acpi/cixvpu_acpi_boot.*
            /sys/dev/acpi/cixvpu_acpi.c
            /sys/dev/acpi/acpi_power.*
            /sys/arch/arm/acpi/acpi_machdep.c
            /sys/arch/arm/acpi/acpi_platform.c
            /sys/arch/arm/acpi/cix_uart2_console.*
            /sys/dev/acpi/acpi_resource.c
            /sys/arch/arm/acpi/plcom_acpi.c
            /sys/arch/evbarm/dev/plcom.c
            /sys/arch/arm/acpi/files.acpi
            /sys/arch/evbarm/conf/EMBER64_CIX_UART2
            /sys/arch/evbarm/conf/EMBER64_CIXVPU_UART2_BOOT_PROBE
            /sys/arch/evbarm/conf/EMBER64_CIXVPU_RPC_UART2_BOOT_PROBE
            /sys/arch/evbarm/conf/EMBER64_CIXVPU_SLOT_PREPARE_PROBE
            /sys/arch/evbarm/conf/EMBER64_CIXVPU_HEVC_FRAME_PROBE
            /sys/arch/evbarm/conf/EMBER64_CIXVPU_BOOT_PROBE
            /sys/arch/evbarm/conf/EMBER64_CIXVPU_NATIVE_PROBE
            /sys/kern/kern_sysctl.c
            /sys/sys/sysctl.h
            /sys/arch/evbarm/conf/EMBER64_CIXSCMI_QUERY
            /sys/arch/evbarm/conf/EMBER64_CIXSCMI_UART_RATE_QUERY
            /sys/arch/evbarm/conf/EMBER64_CIXUART_NATIVE
            /sys/arch/evbarm/conf/EMBER64_CIX_PERIPHERALS
            /sys/arch/evbarm/conf/EMBER64_CIXGPIO_OBSERVE
            /sys/arch/evbarm/conf/EMBER64_CIX_IO_OBSERVE
            /sys/arch/arm/acpi/acpi_iort.c
            /sys/arch/arm/pic/pic.c
            /sys/arch/arm/pic/picvar.h
            /ember/tools/pic-establish-*
            /ember/tools/pic-teardown-*
            /ember/tools/acpi-iort-dma-*
            /sys/dev/acpi/xhci_acpi.c
            /sys/dev/acpi/cixscmi_acpi.*
            /sys/dev/ic/scmi_smt_diag.*
            /sys/dev/ic/cixvpu_*
            /sbin/ifconfig/ifconfig.c
            /sbin/ifconfig/parse.*
            /sbin/ifconfig/util.c
            /sys/net/if.h
            /sys/sys/sockio.h
            /sys/sys/ioccom.h
            /ember/tools/ifconfig-mtu-*
            /sys/dev/pci/if_rge.c
            /sys/dev/pci/if_rgereg.h
            /sys/sys/mbuf.h
            /sys/kern/uipc_mbuf.c
            /ember/tools/rge-rx-contract.*
            /ember/tools/rge-wire-probe*
            /sys/net/bpf.h
            /sys/net/bpf_filter.c
            /sys/sys/queue.h
            /sys/external/bsd/acpica/dist/include/
      - name: Prepare GCC16 and analysis tools
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          gcc -dumpmachine
          apt-get update
          apt-get install -y --no-install-recommends ruby clang cppcheck valgrind libc6-dbg
          clang --version
          cppcheck --version
          valgrind --version
      - name: Run actual providers with path and static analysis
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4 -fanalyzer
          CIXCLK_ANALYZE: '1'
          CIXRESET_ANALYZE: '1'
          CIXVPU_CONTROL_ANALYZE: '1'
          CIXVPU_BOOT_ANALYZE: '1'
          XHCI_ACPI_ANALYZE: '1'
          CIXSCMI_ANALYZE: '1'
          IORT_DMA_ANALYZE: '1'
          CIX_UART2_ANALYZE: '1'
          CIX_PLCOM_ANALYZE: '1'
          RGE_RX_ANALYZE: '1'
          RGE_WIRE_ANALYZE: '1'
          IFCONFIG_MTU_ANALYZE: '1'
        run: |
          sh ember/tools/cixclk-contract.sh
          CIXCLK_NCIXSCMI=0 sh ember/tools/cixclk-contract.sh
          sh ember/tools/cixreset-contract.sh
          sh ember/tools/acpi-power-contract.sh
          sh ember/tools/acpi-iort-dma-contract.sh
          PIC_ESTABLISH_ANALYZE=1 sh ember/tools/pic-establish-contract.sh sys/arch/arm/pic/pic.c "$RUNNER_TEMP/pic-establish-analysis"
          sh ember/tools/pic-teardown-contract.sh sys/arch/arm/pic/pic.c "$RUNNER_TEMP/pic-teardown-analysis"
          sh ember/tools/cixvpu-control-contract.sh
          sh ember/tools/cixvpu-boot-contract.sh
          sh ember/tools/xhci-acpi-rootbus-contract.sh
          sh ember/tools/cixscmi-contract.sh
          sh ember/tools/cix-plcom-contract.sh
          sh ember/tools/cix-uart2-console-contract.sh
          sh ember/tools/rge-rx-contract.sh
          sh ember/tools/rge-wire-probe-contract.sh
          sh ember/tools/ifconfig-mtu-contract.sh
      - name: Run ASan and UBSan
        env:
          CC: gcc
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          sh ember/tools/cixclk-contract.sh
          CIXCLK_NCIXSCMI=0 sh ember/tools/cixclk-contract.sh
          sh ember/tools/cixreset-contract.sh
          sh ember/tools/acpi-power-contract.sh
          sh ember/tools/acpi-iort-dma-contract.sh
          sh ember/tools/pic-establish-contract.sh sys/arch/arm/pic/pic.c "$RUNNER_TEMP/pic-establish-sanitized"
          sh ember/tools/pic-teardown-contract.sh sys/arch/arm/pic/pic.c "$RUNNER_TEMP/pic-teardown-sanitized"
          sh ember/tools/cixvpu-control-contract.sh
          sh ember/tools/cixvpu-boot-contract.sh
          sh ember/tools/xhci-acpi-rootbus-contract.sh
          sh ember/tools/cixscmi-contract.sh
          sh ember/tools/cix-plcom-contract.sh
          sh ember/tools/cix-uart2-console-contract.sh
          sh ember/tools/rge-rx-contract.sh
          sh ember/tools/rge-wire-probe-contract.sh
          sh ember/tools/ifconfig-mtu-contract.sh
      - name: Run complete contracts under Memcheck
        env:
          CC: gcc
          CFLAGS: -O2 -g -gdwarf-4
        run: |
          cat > "$RUNNER_TEMP/cix-platform-memcheck" <<'SH'
          #!/bin/sh
          exec valgrind --tool=memcheck --error-exitcode=97 \
            --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all \
            --track-origins=yes "$@"
          SH
          chmod 755 "$RUNNER_TEMP/cix-platform-memcheck"
          export TEST_RUNNER="$RUNNER_TEMP/cix-platform-memcheck"
          sh ember/tools/cixclk-contract.sh
          CIXCLK_NCIXSCMI=0 sh ember/tools/cixclk-contract.sh
          sh ember/tools/cixreset-contract.sh
          sh ember/tools/acpi-power-contract.sh
          sh ember/tools/acpi-iort-dma-contract.sh
          sh ember/tools/pic-establish-contract.sh sys/arch/arm/pic/pic.c "$RUNNER_TEMP/pic-establish-memcheck"
          sh ember/tools/pic-teardown-contract.sh sys/arch/arm/pic/pic.c "$RUNNER_TEMP/pic-teardown-memcheck"
          "$TEST_RUNNER" "$RUNNER_TEMP/pic-teardown-memcheck/check"
          sh ember/tools/cixvpu-control-contract.sh
          sh ember/tools/cixvpu-boot-contract.sh
          sh ember/tools/xhci-acpi-rootbus-contract.sh
          sh ember/tools/cixscmi-contract.sh
          sh ember/tools/cix-plcom-contract.sh
          sh ember/tools/cix-uart2-console-contract.sh
          sh ember/tools/rge-rx-contract.sh
          sh ember/tools/rge-wire-probe-contract.sh
          sh ember/tools/ifconfig-mtu-contract.sh
