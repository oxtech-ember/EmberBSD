# SPDX-License-Identifier: BSD-2-Clause
# Use the Zero 4 kernel build outputs with the native A733 layout.
. "${DIR}/conf/a733.conf"
board=orangepi-zero4
image=$HOME/${board}.img
a733_kernel_name=netbsd-EMBER64_ORANGEPI_ZERO4
# Select the graphics and on-demand NPU profile on each regular boot.
a733_boot_mode=graphics
boot_trees="sun60i-a733-orangepi-zero4-graphics.dtb"
