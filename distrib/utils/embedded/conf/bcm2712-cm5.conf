# SPDX-License-Identifier: BSD-2-Clause
# CM5 firmware starts EDK2. efiboot reads the ELF kernel from FFS.
board=bcm2712-cm5
gpt=true
gpt_hybrid=true
gpt_create_flags="-p 16"
gpt_label_boot=EFI
gpt_label_ffs=netbsd-root
resize=true
root_overlay=true
os_update_adapter=efiboot
sets="base comp etc"
MKDTB=no

. "${DIR}/conf/evbarm.conf"

cm5_licence=LICENCE.broadcom
cm5_files="bootcode.bin fixup4cd.dat fixup4.dat fixup_cd.dat fixup.dat start4cd.elf start4.elf start_cd.elf start.elf"
cm5_firmware="${src}/external/broadcom/rpi-firmware/dist"

validate_inputs() {
	[ -z "$bootonly" ] && [ -d "$kernel" ] || fail "CM5 requires a full image and -K"
	for file in netbsd bootaa64.efi; do
		[ -s "${kernel}/$file" ] || fail "Missing kernel-directory file $file"
	done
	[ "$(od -An -tx1 -N4 "${kernel}/netbsd" | tr -d ' \n')" = 7f454c46 ] ||
	    fail "The CM5 kernel must be ELF"
	[ -s "${CM5_UEFI:-}" ] && [ -s "${CM5_FIRMWARE_DTB:-}" ] ||
	    fail "Set CM5_UEFI and CM5_FIRMWARE_DTB to the verified firmware inputs"
	[ "$(od -An -tx1 -N4 "$CM5_FIRMWARE_DTB" | tr -d ' \n')" = d00dfeed ] ||
	    fail "Invalid CM5 firmware DTB"
	for file in $cm5_licence $cm5_files; do
		[ -s "${cm5_firmware}/$file" ] || fail "Missing Raspberry Pi firmware file $file"
	done
}

make_label() { make_label_evbarm; }
make_fstab() { make_fstab_evbarm; }

customize() {
	customize_evbarm
	printf 'mdnsd=YES\ndevpubd=YES\n' >> "${mnt}/etc/rc.conf"
}

populate() {
	mkdir -p "${mnt}/boot/EFI/BOOT"
	cp "${kernel}/netbsd" "${mnt}/netbsd"
	echo './netbsd type=file uname=root gname=wheel mode=0755' >> "$tmp/selected_sets"
	cp "${kernel}/bootaa64.efi" "${mnt}/boot/EFI/BOOT/bootaa64.efi"
	cp "$CM5_UEFI" "${mnt}/boot/RPI_EFI.fd"
	cp "$CM5_FIRMWARE_DTB" "${mnt}/boot/bcm2712-rpi-5-b.dtb"
	for file in $cm5_licence $cm5_files; do
		cp "${cm5_firmware}/$file" "${mnt}/boot/$file"
	done
	cat > "${mnt}/boot/config.txt" <<'CONFIG'
[all]
arm_64bit=1
armstub=RPI_EFI.fd
device_tree=bcm2712-rpi-5-b.dtb
device_tree_address=0x3e0000
device_tree_end=0x400000
framebuffer_depth=32
disable_overscan=1
enable_uart=1
CONFIG
	cat > "${mnt}/boot/boot.cfg" <<CONFIG
menu=Boot EmberBSD:boot hd0b:netbsd root=NAME=$gpt_label_ffs
default=1
timeout=0
CONFIG
}
