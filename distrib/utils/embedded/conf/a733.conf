# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD contributors (AI-assisted).
# Native A733 U-Boot image with explicitly supplied vendor boot data.
board=a733
resize=true
gpt=true
gpt_hybrid=true
gpt_create_flags="-p 16"
gpt_label_boot=EFI
gpt_label_ffs=netbsd-root
root_overlay=true
sets="base comp etc"
MKDTB=no

. "${DIR}/conf/evbarm.conf"

init=64		# 32 MiB, in units of 512 KiB
boot=512	# 256 MiB
ffsoffset=$(( (init + boot) / 2 ))m
a733_boot0_offset=8192
a733_package_offset=16793600
a733_dtbs="sun60i-a733-orangepi-zero4.dtb sun60i-a733-orangepi-zero3w.dtb sun60i-a733-orangepi-zero3w-diagnostic.dtb"

a733_magic() {
	od -An -tx1 -j "$2" -N "$3" "$1" | tr -d ' \n'
}

# Read the unsigned little-endian length without depending on host endianness.
a733_blob_length() {
	local file=$1 length_offset=$2 magic_offset=$3 magic_size=$4 magic=$5
	[ -f "$file" ] && [ -r "$file" ] || fail "Missing A733 vendor blob"
	[ "$(a733_magic "$file" "$magic_offset" "$magic_size")" = "$magic" ] ||
	    fail "Invalid A733 vendor signature"
	set -- $(od -An -tu1 -j "$length_offset" -N 4 "$file")
	[ "$#" = 4 ] || fail "Truncated A733 vendor header"
	local length=$(( $1 + ($2 << 8) + ($3 << 16) + ($4 << 24) ))
	[ "$length" -gt 0 ] && [ $((length % 512)) = 0 ] &&
	    [ "$length" -eq "$(wc -c < "$file")" ] ||
	    fail "A733 vendor length must match the file and 512-byte alignment"
	echo "$length"
}

validate_inputs() {
	[ -z "${bootonly}" ] || fail "A733 requires a complete root filesystem"
	[ -n "${kernel}" ] || fail "A733 requires -K kernel-directory"
	[ -n "${A733_BOOT0}" ] && [ -n "${A733_BOOT_PACKAGE}" ] ||
	    fail "Set A733_BOOT0 and A733_BOOT_PACKAGE to verified vendor files"
	[ ! -L "$image" ] || fail "Output must not be a symbolic link"
	[ ! -e "$image" ] || [ -f "$image" ] || fail "Output must be an image file"
	[ -z "${custom}" ] || [ -d "${custom}" ] || fail "Root overlay is not a directory"
	if [ -n "${custom}" ]; then
		for file in boot netbsd; do
			[ ! -e "${custom}/$file" ] && [ ! -L "${custom}/$file" ] ||
			    fail "The A733 overlay must preserve the selected kernel and boot files"
		done
	fi
	for file in NetBSD.dist set.base set.comp set.etc; do
		[ -s "${release}/etc/mtree/$file" ] || fail "Missing DESTDIR manifest $file"
	done
	for file in netbsd netbsd.img $a733_dtbs; do
		[ -s "${kernel}/$file" ] || fail "Missing A733 kernel-directory file $file"
	done
	[ "$(a733_magic "${kernel}/netbsd" 0 4)" = 7f454c46 ] || fail "Kernel is not ELF"
	[ "$(a733_magic "${kernel}/netbsd.img" 56 4)" = 41524d64 ] ||
	    fail "Kernel image is not a native ARM64 image"
	for file in $a733_dtbs; do
		[ "$(a733_magic "${kernel}/$file" 0 4)" = d00dfeed ] || fail "Invalid A733 DTB"
	done
	[ -s "${src}/ember/boot/orangepi-zero4-boot.cmd" ] || fail "Missing A733 boot script"
	a733_boot0_size=$(a733_blob_length "$A733_BOOT0" 16 4 8 65474f4e2e425430)
	a733_package_size=$(a733_blob_length "$A733_BOOT_PACKAGE" 36 0 13 73756e78692d7061636b616765)
	# Sixteen GPT entries occupy four sectors after the primary header.
	[ "$a733_boot0_offset" -ge $((6 * 512)) ] &&
	    [ $((a733_boot0_offset + a733_boot0_size)) -le "$a733_package_offset" ] &&
	    [ $((a733_package_offset + a733_package_size)) -le $((init * 524288)) ] ||
	    fail "A733 vendor data overlaps GPT or the boot partition"
	# Only validated inputs may change an existing output's permissions.
	# Both new and rebuilt images can contain a private overlay.
	umask 077
	[ ! -f "$image" ] || chmod 0600 "$image"
}

make_fstab() { make_fstab_evbarm; }
make_label() { make_label_evbarm; }

customize() {
	customize_evbarm
	printf 'mdnsd=YES\ndevpubd=YES\n' >> "${mnt}/etc/rc.conf"
}

populate() {
	mkdir -p "${mnt}/boot/dtb/allwinner"
	cp "${kernel}/netbsd.img" "${mnt}/boot/netbsd.img"
	cp "${kernel}/netbsd" "${mnt}/netbsd"
	for file in $a733_dtbs; do
		cp "${kernel}/$file" "${mnt}/boot/dtb/allwinner/$file"
	done
	echo './netbsd type=file uname=root gname=wheel mode=0755' >> "$tmp/selected_sets"
	set --
	[ -z "${MKREPRO_TIMESTAMP}" ] || set -- -t "$MKREPRO_TIMESTAMP"
	${MKUBOOTIMAGE} -A arm64 -C none -O netbsd -T script -a 0 \
	    -n EmberBSD "$@" "${src}/ember/boot/orangepi-zero4-boot.cmd" "${mnt}/boot/boot.scr"
}

finalize_image() {
	dd if="$A733_BOOT0" of="$image" bs=512 seek=$((a733_boot0_offset / 512)) \
	    count=$((a733_boot0_size / 512)) conv=notrunc 2>/dev/null
	dd if="$A733_BOOT_PACKAGE" of="$image" bs=512 seek=$((a733_package_offset / 512)) \
	    count=$((a733_package_size / 512)) conv=notrunc 2>/dev/null
}
