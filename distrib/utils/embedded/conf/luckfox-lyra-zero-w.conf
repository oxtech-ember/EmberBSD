# SPDX-License-Identifier: BSD-2-Clause
# Build the RK3506B microSD layout for the U-Boot script boot method.
board=luckfox-lyra-zero-w
gpt=true
resize=true
root_overlay=true
stage_output=true
sets="base etc"
MKDTB=no

. "${DIR}/conf/evbarm.conf"

lyra_dtb=rk3506b-luckfox-lyra-zero-w.dtb
lyra_loader_sha256=7a53323b5f2948caa377ae28a3d7a2971e2c28d5d4bb4328a473f0a1ccaba815

validate_inputs() {
	[ -d "${kernel:-}" ] && [ -s "$kernel/netbsd-GENERIC.ub" ] ||
	    fail "Select the earmv7hf GENERIC build outputs with -K"
	# Validate the same immutable copies that will go on FAT.
	cp "$kernel/netbsd-GENERIC.ub" "$kernel/$lyra_dtb" "$mnt/boot/"
	"${TOOL_PYTHON:-python3}" -B "$DIR/check-armv7-uboot.py" "$mnt/boot/netbsd-GENERIC.ub" ||
	    fail "Invalid GENERIC kernel boot image"
	[ "$("${TOOL_FDTGET:-fdtget}" -t s "$mnt/boot/$lyra_dtb" / compatible)" = "luckfox,lyra-zero-w rockchip,rk3506" ] ||
	    fail "Select the Luckfox Lyra Zero W device tree"
	[ -f "${RK3506_UBOOT:-}" ] || fail "Set RK3506_UBOOT to u-boot-rockchip.bin"
	cp "$RK3506_UBOOT" "$tmp/u-boot-rockchip.bin"
	[ "$("${TOOL_CKSUM:-cksum}" -a SHA256 -q "$tmp/u-boot-rockchip.bin")" = "$lyra_loader_sha256" ] ||
	    fail "The RK3506B loader does not match the selected boot profile"
	if [ -n "$bootonly" ]; then
		[ -z "$custom" ] || fail "A root overlay requires a full image"
		# FAT construction only reads the OS user and group databases.
		release=$src
		return
	fi
	for file in etc/mtree/NetBSD.dist etc/mtree/set.base etc/mtree/set.etc sbin/init; do
		[ -s "$release/$file" ] || fail "Missing release input: $file"
	done
	# e_ident selects ELF32 little-endian. e_machine selects EM_ARM.
	cp "$kernel/netbsd-GENERIC" "$mnt/netbsd"
	for file in "$release/sbin/init" "$mnt/netbsd"; do
		[ "$(od -An -tx1 -N6 "$file" | tr -d ' \n')" = 7f454c460101 ] &&
		    [ "$(od -An -tx1 -j18 -N2 "$file" | tr -d ' \n')" = 2800 ] ||
		    fail "Expected a little-endian ARM32 ELF file: $file"
	done
	"${TOOL_OBJCOPY:-objcopy}" -S -O binary "$mnt/netbsd" "$tmp/generic.img" ||
	    fail "Cannot extract the ARM kernel payload"
	tail -c +65 "$mnt/boot/netbsd-GENERIC.ub" | cmp -s - "$tmp/generic.img" ||
	    fail "The selected ELF and uImage contain different kernels"
	if [ -n "$custom" ]; then
		[ -d "$custom" ] || fail "Root overlay must be a directory"
		for file in boot netbsd; do
			[ ! -e "$custom/$file" ] && [ ! -L "$custom/$file" ] ||
			    fail "The root overlay must preserve $file"
		done
	fi
}

make_fstab() {
	[ -n "$bootonly" ] || make_fstab_evbarm
}

customize() {
	[ -z "$bootonly" ] || return 0
	customize_evbarm
	printf '%s\n' mdnsd=YES devpubd=YES >> "$mnt/etc/rc.conf"
}

populate() {
	set --
	[ -z "${MKREPRO_TIMESTAMP:-}" ] || set -- -t "$MKREPRO_TIMESTAMP"
	"${MKUBOOTIMAGE}" -A arm -O netbsd -C none -T script -a 0 -n EmberBSD "$@" \
	    "$src/ember/boot/rk3506-lyra-zero-w.cmd" "$mnt/boot/boot.scr"
	if [ -z "$bootonly" ]; then
		echo './netbsd type=file uname=root gname=wheel mode=0755' >> "$tmp/selected_sets"
	fi
}

finalize_image() {
	# The 9,074,176-byte loader starts at LBA 64. FAT starts at 16 MiB.
	dd if="$tmp/u-boot-rockchip.bin" of="$image" bs=32768 seek=1 conv=notrunc
}
